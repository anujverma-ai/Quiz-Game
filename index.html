<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <section id="setup-box">
      <h1>Practice Quiz</h1>
      <p id="available-questions">Unlimited questions available</p>

      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="all">All</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="question-count">Number of questions</label>
      <select id="question-count">
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="start-btn" type="button">Start practice</button>
    </section>

    <section id="quiz-box">
      <div class="meta">
        <span id="question-number"></span>
        <span id="score-display">Score: 0</span>
      </div>
      <div class="progress"><div id="progress" class="progress-bar"></div></div>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback"></p>
      <button id="next-btn" type="button">Next</button>
    </section>

    <section id="result">
      <h1>Results</h1>
      <p id="score"></p>
      <button id="restart-btn" type="button">Practice again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
